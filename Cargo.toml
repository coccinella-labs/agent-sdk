[package]
name = "coccinella-agent-sdk"
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.85.0"
authors = ["Coccinella Labs"]
license = "MIT OR Apache-2.0"
description = "Minimal reusable agent runtime: normalized ToolCall, provider abstraction, tool dispatch, and a tiny loop."
repository = "https://github.com/coccinella-labs/agent-sdk"
homepage = "https://github.com/coccinella-labs/agent-sdk"
readme = "README.md"
keywords = ["agent", "llm", "tool-call", "runtime"]
categories = ["api-bindings", "development-tools"]

[dependencies]
async-trait = "0.1"
reqwest = { version = "0.12.20", features = ["json", "native-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread"] }